version: "v0.4"
project:
  name: Sequence Growth
  description: Natural-division recurrence bounds and eventual exponential domination for sequences of natural numbers.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier source-maintainer team (responsible maintainer Beacon)
  license: Apache-2.0
sources:
  - title: Natural-division lower-recurrence growth bounds (original formalization)
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: independently-proves
    author_endorsement: participated
    note: General lower-recurrence API developed for reuse; a motivating mathematical question does not imply formalization of an entire external source.
automation:
  methods:
    - method: agent
      framework: Codex CLI and Lean
      tool_setup: Agent-assisted Lean proofs transferred from an accepted incubator contribution into this standalone library.
  notes: Formal Frontier Agents authored the original proof and separately prepared its standalone transfer. The destination code and first release received independent review; a matching-cache, both-root build and complete transitive standard-axiom audit supported the first release.
status:
  scope: Two public natural-division growth theorems, plus ordinary-import client examples and boundary tests.
  main_results:
    - declaration: Nat.DivisionGrowth.affine_lower_bound
      file: SequenceGrowth/Data/Nat/DivisionGrowth.lean
      sorry_count: 0
    - declaration: Nat.DivisionGrowth.eventually_dominates
      file: SequenceGrowth/Data/Nat/DivisionGrowth.lean
      sorry_count: 0
review:
  status: agent-reviewed
  reviewers:
    - Formal Frontier Agents (separate independent destination-code and first-release reviewers)
  notes: The destination code and first-release content/history were independently reviewed and accepted for that release. These reviews do not assess later modifications or assert full external-source coverage.
acknowledgements: Formal Frontier Agents authored the original Lean proof and separately prepared its standalone transfer; independent reviewers examined the destination code and first release. Mathlib supplies the arithmetic foundations.
