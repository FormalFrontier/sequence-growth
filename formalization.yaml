      file: SequenceGrowth/Data/Nat/DivisionGrowth.lean
      sorry_count: 0
    - declaration: Nat.DivisionGrowth.eventually_dominates
      file: SequenceGrowth/Data/Nat/DivisionGrowth.lean
      sorry_count: 0
review:
  status: agent-reviewed
  reviewers:
